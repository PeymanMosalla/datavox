<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پنل فروشنده DataVox</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { background: var(--bg); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
    .stat-box { padding: 14px 16px; margin: 0 !important; }
    .stat-box b { font-size: 22px; display: block; }
    .details td { background: var(--surface-2, rgba(127,127,127,.06)); }
    textarea.input { width: 100%; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 style="margin:0">پنل فروشنده «DataVox»</h1>
    <div class="muted small" id="sub"></div>
    <div id="alerts" class="stack" style="margin-top:12px"></div>
    <div class="stats" id="stats"></div>
    <div class="card">
      <div class="card-h"><div class="tabs" id="tabs">
        <button data-tab="issue" class="active">صدور مجوز</button>
        <button data-tab="customers">مشتری‌ها</button>
        <button data-tab="due">تمدیدهای نزدیک</button>
        <button data-tab="settings">تنظیمات</button>
      </div></div>
      <div class="card-b" id="tab"></div>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <script src="/panel.js"></script>
</body>
</html>
