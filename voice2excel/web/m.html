<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3355d6">
<title>ارسال ویس</title>
<style>
  @font-face { font-family: "Vazirmatn"; src: url("/static/fonts/Vazirmatn.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root { --bg: #f4f6fb; --card: #fff; --text: #1b2236; --muted: #6b7385; --border: #e3e7f0; --primary: #3355d6; --soft: #e9eefc;
    --ok: #138a52; --ok-soft: #e3f5ec; --warn: #b26a00; --warn-soft: #fff3dc; --err: #cc2b3b; --err-soft: #fde8ea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1320; --card: #171c2c; --text: #e8ebf4; --muted: #8a93ad; --border: #2a3249;
    --primary: #6f8cff; --soft: #222c4f; --ok: #3fcb85; --ok-soft: #14301f; --warn: #f0b44c; --warn-soft: #34290f; --err: #ff6b7a; --err-soft: #3a1820; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Vazirmatn", Tahoma, sans-serif; font-size: 16px; line-height: 1.8;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 12px; padding: 18px 0 8px; }
  .logo { width: 44px; height: 44px; border-radius: 13px; background: linear-gradient(135deg, #3355d6, #6d4fd8); display: grid; place-items: center; flex: none; }
  .logo svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; }
  h1 { font-size: 19px; margin: 0; } .sub { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-top: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
  input[type=text], input[type=password], input[inputmode] { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font: inherit; padding: 0 14px; }
  .pin { letter-spacing: 8px; text-align: center; font-size: 22px; direction: ltr; }
  .btn { width: 100%; height: 54px; border-radius: 14px; border: none; font: inherit; font-weight: 700; font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.soft { background: var(--soft); color: var(--primary); }
  .btn:disabled { opacity: .5; }
  .stack > * + * { margin-top: 12px; }
  .files { list-style: none; padding: 0; margin: 10px 0 0; }
  .files li { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .files li:last-child { border-bottom: none; }
  .files .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: right; }
  .chip { font-size: 12.5px; font-weight: 700; border-radius: 10px; padding: 1px 10px; white-space: nowrap; }
  .ok { background: var(--ok-soft); color: var(--ok); } .warn { background: var(--warn-soft); color: var(--warn); }
  .err { background: var(--err-soft); color: var(--err); } .info { background: var(--soft); color: var(--primary); }
  .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--primary); transition: width .3s; }
  .msg { padding: 10px 14px; border-radius: 12px; font-size: 14px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; }
  [hidden] { display: none !important; }
  a { color: var(--primary); }
</style>
</head>
<body>
  <header>
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 4a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V7a3 3 0 0 0-3-3Zm-6 8a6 6 0 0 0 12 0M12 18v2.5"/></svg></div>
    <div><h1>ارسال ویس بازدید</h1><div class="sub">ویس‌ها مستقیم به برنامه «ثبت ویس» در دفتر می‌رسند</div></div>
  </header>

  <section class="card stack" id="login" hidden>
    <div><label for="pin">رمز شش‌رقمی</label><input id="pin" class="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••"></div>
    <div><label for="sender-l">نام شما</label><input id="sender-l" type="text" placeholder="مثلاً صالحی" maxlength="40"></div>
    <button class="btn primary" id="login-btn">ورود</button>
    <div class="muted">رمز را از بخش «تنظیمات» برنامه روی رایانه دفتر بگیرید.</div>
    <div class="msg err" id="login-err" hidden></div>
  </section>

  <main id="app" hidden>
    <section class="card stack">
      <div class="row">
        <div><label for="sender">نام شما</label><input id="sender" type="text" maxlength="40"></div>
        <div><label for="date">تاریخ بازدید</label><input id="date" type="text" inputmode="numeric" dir="ltr" style="text-align:right"></div>
      </div>
      <input type="file" id="pick" accept="audio/*,.ogg,.opus,.oga,.m4a,.amr,.mp3,.wav,.aac" multiple hidden>
      <button class="btn soft" id="pick-btn">انتخاب ویس‌ها</button>
      <ul class="files" id="picked"></ul>
      <div id="prog" hidden><div class="bar"><div id="bar"></div></div><div class="muted" id="prog-t"></div></div>
      <button class="btn primary" id="send" disabled>ارسال</button>
      <div class="msg" id="send-msg" hidden></div>
    </section>
    <section class="card">
      <b>آخرین ویس‌های شما</b>
      <ul class="files" id="recent"><li class="muted">هنوز ویسی نفرستاده‌اید.</li></ul>
    </section>
    <p class="muted" style="text-align:center"><a href="/static/recording-guide.html">راهنمای ضبط ویس</a> · <a href="#" id="logout">خروج</a></p>
  </main>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const fa = (n) => String(n ?? "").replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get: (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch { } }, del: (k) => { try { localStorage.removeItem(k); } catch { } } };
const STATUS = { queued: ["info", "در صف"], processing: ["warn", "در حال پردازش"], done: ["ok", "پردازش شد"], failed: ["err", "ناموفق"] };
let picked = [];

async function call(path, opt = {}) {
  const res = await fetch(path, { ...opt, headers: { ...(opt.headers || {}), "X-PIN": store.get("v2x.m.pin") } });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { store.del("v2x.m.pin"); showLogin("رمز نادرست است یا تغییر کرده است."); throw new Error("401"); }
  if (!res.ok) throw new Error(data.detail || "خطا در ارتباط با برنامه.");
  return data;
}
function showLogin(err) {
  $("#app").hidden = true; $("#login").hidden = false;
  $("#sender-l").value = store.get("v2x.m.sender");
  $("#login-err").hidden = !err; $("#login-err").textContent = err || "";
}
async function showApp() {
  const info = await call("/api/m/check", { method: "POST" });
  $("#login").hidden = true; $("#app").hidden = false;
  $("#sender").value = store.get("v2x.m.sender");
  $("#date").value = info.today;
  loadRecent();
}
$("#login-btn").onclick = async () => {
  const pin = $("#pin").value.replace(/\D/g, "");
  if (pin.length !== 6) return showLogin("رمز باید شش رقم باشد.");
  store.set("v2x.m.pin", pin);
  store.set("v2x.m.sender", $("#sender-l").value.trim());
  try { await showApp(); } catch (e) { if (e.message !== "401") showLogin(e.message); }
};
$("#logout").onclick = (e) => { e.preventDefault(); store.del("v2x.m.pin"); showLogin(); };
$("#sender").onchange = () => { store.set("v2x.m.sender", $("#sender").value.trim()); loadRecent(); };
$("#pick-btn").onclick = () => $("#pick").click();
$("#pick").onchange = (e) => {
  picked = picked.concat(Array.from(e.target.files));
  e.target.value = "";
  drawPicked();
};
function drawPicked() {
  $("#picked").innerHTML = picked.map((f, i) => `<li><span class="n">${esc(f.name)}</span><span class="muted">${fa(Math.round(f.size / 1024))} KB</span>
    <button class="chip err" data-rm="${i}" style="border:none">حذف</button></li>`).join("");
  document.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { picked.splice(+b.dataset.rm, 1); drawPicked(); });
  $("#send").disabled = !picked.length;
  $("#send").textContent = picked.length ? `ارسال ${fa(picked.length)} ویس` : "ارسال";
}
$("#send").onclick = () => {
  if (!picked.length) return;
  const fd = new FormData();
  picked.forEach((f) => fd.append("files", f, f.name));
  fd.append("visit_date", $("#date").value.trim());
  fd.append("sender", $("#sender").value.trim());
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/m/upload");
  xhr.setRequestHeader("X-PIN", store.get("v2x.m.pin"));
  $("#prog").hidden = false; $("#send").disabled = true; $("#send-msg").hidden = true;
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) { const p = Math.round(100 * e.loaded / e.total); $("#bar").style.width = p + "%"; $("#prog-t").textContent = `در حال ارسال… ${fa(p)}٪`; } };
  xhr.onload = () => {
    $("#prog").hidden = true;
    let d = {}; try { d = JSON.parse(xhr.responseText); } catch { }
    if (xhr.status === 401) { store.del("v2x.m.pin"); return showLogin("رمز نادرست است یا تغییر کرده است."); }
    const box = $("#send-msg");
    box.hidden = false;
    if (xhr.status >= 300) { box.className = "msg err"; box.textContent = d.detail || "ارسال ناموفق بود."; $("#send").disabled = false; return; }
    const added = d.results.filter((r) => r.result === "added").length;
    const others = d.results.filter((r) => r.result !== "added");
    box.className = "msg " + (others.length ? "warn" : "ok");
    box.innerHTML = `${fa(added)} ویس رسید و در صف پردازش قرار گرفت.` + others.map((r) => `<div>${esc(r.name)}: ${esc(r.message)}</div>`).join("");
    picked = []; drawPicked(); loadRecent();
  };
  xhr.onerror = () => { $("#prog").hidden = true; $("#send").disabled = false; const b = $("#send-msg"); b.hidden = false; b.className = "msg err"; b.textContent = "ارتباط با رایانه دفتر برقرار نشد. آیا به همان شبکه وای‌فای وصل هستید؟"; };
  xhr.send(fd);
};
async function loadRecent() {
  try {
    const d = await call("/api/m/recent?sender=" + encodeURIComponent($("#sender").value.trim()));
    $("#recent").innerHTML = d.files.length ? d.files.map((f) => { const [c, l] = STATUS[f.status] || ["info", f.status];
      return `<li><span class="n">${esc(f.original_name)}</span><span class="chip ${c}">${l}</span></li>`; }).join("") : '<li class="muted">هنوز ویسی نفرستاده‌اید.</li>';
  } catch { }
}
setInterval(() => { if (!$("#app").hidden && !document.hidden) loadRecent(); }, 5000);
if (store.get("v2x.m.pin")) showApp().catch((e) => { if (e.message !== "401") showLogin(e.message); }); else showLogin();
</script>
</body>
</html>
