<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataVox</title>
  <link rel="icon" type="image/png" href="/static/brand/mark.png">
  <script src="/static/boot.js"></script>
  <script src="/static/modern.js"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="titlebar" id="titlebar">
    <div class="tb-title"><span class="tb-logo"><img src="/static/brand/mark.png" alt="" draggable="false"></span>
      <b>DataVox</b><span class="tb-page" id="tb-page"></span></div>
    <div class="tb-btns">
      <button class="tb-btn" data-win="min" title="کوچک کردن" aria-label="کوچک کردن"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
      <button class="tb-btn" data-win="max" title="بزرگ کردن" aria-label="بزرگ کردن"><svg class="i-max" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg><svg class="i-restore" viewBox="0 0 10 10"><rect x=".5" y="2.5" width="7" height="7"/><path d="M2.5 2.5V.5h7v7h-2"/></svg></button>
      <button class="tb-btn tb-close" data-win="close" title="بستن" aria-label="بستن"><svg viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button>
    </div>
  </header>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo"><img src="/static/brand/mark.png" alt="" draggable="false"></div>
        <div>
          <div class="brand-name">DataVox</div>
          <div class="brand-sub">از ویس بازاریاب تا ردیف اکسل</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/files" data-page="files">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
          <span>فایل‌های من</span><b class="badge warn" id="nav-files"></b></a>
        <a href="#/history" data-page="history">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
          <span>تاریخچه ثبت‌ها</span></a>
        <a href="#/settings" data-page="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          <span>تنظیمات</span></a>
        <a href="#/activate" data-page="activate">
          <svg viewBox="0 0 24 24"><path d="M4 13v-1a8 8 0 0 1 16 0v1M4 13a2 2 0 0 1 2-2h1v6H6a2 2 0 0 1-2-2v-2Zm16 0a2 2 0 0 0-2-2h-1v6h1a2 2 0 0 0 2-2v-2Zm-3 4v1a3 3 0 0 1-3 3h-2"/></svg>
          <span>اشتراک و پشتیبانی</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="worker-pill" id="worker-pill"><span class="dot"></span><span id="worker-text">آماده</span></div>
        <a class="side-link" href="/static/guide.html" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>
          راهنمای استفاده</a>
        <div class="offline-note">
          <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3Z"/></svg>
          پردازش کاملاً محلی و آفلاین
        </div>
        <button class="btn ghost sm theme-btn" id="btn-theme" title="تغییر تم: خودکار، روشن، تیره">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span id="theme-label">تم: خودکار</span>
        </button>
        <button class="btn ghost sm" id="btn-exit" style="justify-content:flex-start">
          <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
          خروج از برنامه
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="crumb-bar" id="crumb-bar" hidden>
        <nav class="crumbs" id="crumbs" aria-label="مسیر صفحه"></nav>
        <a class="crumb-back" id="crumb-back" href="#/files"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>بازگشت</a>
      </div>
      <header class="topbar">
        <div>
          <h1 id="page-title">داشبورد</h1>
        </div>
        <div class="topbar-progress" id="top-progress" hidden>
          <div class="tp-label"><span id="tp-name"></span><span id="tp-pct"></span></div>
          <div class="progress"><div class="progress-bar" id="tp-bar"></div></div>
        </div>
      </header>
      <div class="banners" id="banners"></div>
      <section class="page" id="page"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="modal-backdrop" id="modal-backdrop" hidden><div class="modal" id="modal"></div></div>
  <div class="toasts" id="toasts"></div>

  <script src="/static/app.js"></script>
</body>
</html>
