<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ثبت ویس</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%233355d6'/%3E%3Cpath d='M12 5a2.5 2.5 0 0 0-2.5 2.5v4a2.5 2.5 0 0 0 5 0v-4A2.5 2.5 0 0 0 12 5Zm-5 6.5a5 5 0 0 0 10 0M12 16.5V19' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <script src="/static/boot.js"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24"><path d="M12 4a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V7a3 3 0 0 0-3-3Zm-6 8a6 6 0 0 0 12 0M12 18v2.5"/></svg>
        </div>
        <div>
          <div class="brand-name">ثبت ویس</div>
          <div class="brand-sub">از ویس بازاریاب تا ردیف اکسل</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/today" data-page="today">
          <svg viewBox="0 0 24 24"><path d="M9 11l2 2 4-4"/><path d="M4 6h16M4 12h3M4 18h16"/></svg>
          <span>کار امروز</span><b class="badge warn" id="nav-today"></b></a>
        <a href="#/templates" data-page="templates">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 9v12"/><path d="M13 13h5M13 17h3"/></svg>
          <span>قالب اکسل</span></a>
        <a href="#/dashboard" data-page="dashboard" class="adv">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
          <span>داشبورد</span></a>
        <a href="#/voices" data-page="voices" class="adv">
          <svg viewBox="0 0 24 24"><path d="M12 4a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V7a3 3 0 0 0-3-3Zm-6 8a6 6 0 0 0 12 0M12 18v2.5"/></svg>
          <span>ویس‌ها و پردازش</span><b class="badge" id="nav-queue"></b></a>
        <a href="#/review" data-page="review" class="adv">
          <svg viewBox="0 0 24 24"><path d="M9 11l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>
          <span>بازبینی اطلاعات</span><b class="badge warn" id="nav-review"></b></a>
        <a href="#/excel" data-page="excel" class="adv">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
          <span>ثبت در اکسل</span><b class="badge ok" id="nav-approved"></b></a>
        <a href="#/dictionary" data-page="dictionary" class="adv">
          <svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
          <span>واژه‌نامه</span></a>
        <a href="#/settings" data-page="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          <span>تنظیمات</span></a>
        <a href="/static/guide.html" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>
          <span>راهنما</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="worker-pill" id="worker-pill"><span class="dot"></span><span id="worker-text">آماده</span></div>
        <div class="offline-note">
          <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3Z"/></svg>
          پردازش کاملاً محلی و آفلاین
        </div>
        <button class="btn ghost sm theme-btn" id="btn-theme" title="تغییر تم: خودکار، روشن، تیره">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span id="theme-label">تم: خودکار</span>
        </button>
        <button class="btn ghost sm" id="btn-exit" style="justify-content:flex-start">
          <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>
          خروج از برنامه
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">داشبورد</h1>
          <div class="page-sub" id="page-sub"></div>
        </div>
        <div class="topbar-progress" id="top-progress" hidden>
          <div class="tp-label"><span id="tp-name"></span><span id="tp-pct"></span></div>
          <div class="progress"><div class="progress-bar" id="tp-bar"></div></div>
        </div>
      </header>
      <div class="banners" id="banners"></div>
      <section class="page" id="page"></section>
    </main>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="modal-backdrop" id="modal-backdrop" hidden><div class="modal" id="modal"></div></div>
  <div class="toasts" id="toasts"></div>

  <script src="/static/app.js"></script>
</body>
</html>
